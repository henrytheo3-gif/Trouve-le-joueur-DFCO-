<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trouve le Joueur - Version DFCO</title>

    <link rel="stylesheet" href="style.css">

    <!-- Police Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Écran d'accueil -->
    <div id="home-screen">

        <img src="assets/logo.png" alt="Logo DFCO" class="logo">

        <h1>Trouve le Joueur</h1>

        <h2>Version DFCO</h2>

        <p class="creator">
            Un jeu créé par <strong>@thdu21</strong>
        </p>

        <button id="play-button">
            COMMENCER
        </button>

    </div>

    <!-- Écran du jeu -->
    <div id="game-screen" class="hidden">

        <div class="top-bar">

            <div id="level">
                Niveau 1 / 250
            </div>

            <div id="progress">
                0%
            </div>

        </div>

        <div id="career-card">

            <!-- Les clubs seront affichés ici -->

        </div>

        <div id="answer">

            <!-- Les cases du nom -->

        </div>

        <div id="keyboard">

            <!-- Le clavier sera généré automatiquement -->

        </div>

        <div id="hints">

            <button id="hint-letter">
                💡 Lettre
            </button>

            <button id="hint-position">
                🧤 Poste
            </button>

            <button id="hint-country">
                🌍 Nationalité
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
